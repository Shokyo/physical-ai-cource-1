# Velocity limits are the GP8 catalogue values (as in the URDF); acceleration
# limits are conservative values for simulation. Pilz and time parameterization
# need both.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 7.94
    has_acceleration_limits: true
    max_acceleration: 6.0
